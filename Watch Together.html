<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Watch Together — Open presentation</title>
  <link rel="icon" href="favicon.svg" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }
    .card {
      width: min(520px, 100%);
      text-align: center;
    }
    .logo {
      height: 38px;
      width: auto;
      margin: 0 auto 36px;
      display: block;
    }
    h1 {
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 700;
      letter-spacing: -0.6px;
      line-height: 1.1;
    }
    p {
      margin-top: 14px;
      color: #b3b3b3;
      font-size: 16px;
      line-height: 1.45;
    }
    .status {
      margin-top: 18px;
      font-size: 13px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #6b6b6b;
    }
    .status.ok { color: #46d369; }
    .status.wait { color: #f5c518; }
    .actions {
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 260px;
      padding: 14px 22px;
      border-radius: 4px;
      background: #e50914;
      color: #fff;
      font: 700 16px/1 "Helvetica Neue", Helvetica, Arial, sans-serif;
      text-decoration: none;
    }
    .hint {
      margin-top: 28px;
      font-size: 13px;
      color: #6b6b6b;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="media/netflix-logo.svg" alt="Netflix" />
    <h1>Watch Together</h1>
    <p>Tonight is a match, not a debate.</p>
    <p class="status wait" id="status">Looking for the demo on this computer…</p>
    <div class="actions">
      <a class="btn" id="open" href="http://localhost:3000">Open presentation</a>
    </div>
    <p class="hint">
      If nothing opens, double-click <strong>Start Demo.command</strong> (Mac)
      or <strong>Start Demo.bat</strong> (Windows), then click Open presentation.
    </p>
  </main>
  <script>
    const status = document.getElementById('status');
    const DEMO = 'http://localhost:3000';
    let tries = 0;

    async function ping() {
      try {
        const res = await fetch(DEMO + '/api/health', { cache: 'no-store' });
        if (!res.ok) throw new Error('down');
        status.textContent = 'Demo is running — opening…';
        status.className = 'status ok';
        window.location.replace(DEMO);
        return true;
      } catch (_) {
        tries += 1;
        status.textContent = tries < 8
          ? 'Demo is not running yet. Start it, then this page will jump in.'
          : 'Start the demo, then click Open presentation.';
        status.className = 'status wait';
        return false;
      }
    }

    ping();
    setInterval(ping, 1200);
  </script>
</body>
</html>
